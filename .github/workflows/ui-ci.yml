name: UI CI/CD

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'src/**'
      - 'public/**'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'public/**'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'package.json'
      - 'package-lock.json'

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x]

    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: 'package-lock.json'
    
    - name: Install dependencies
      run: npm ci
      working-directory: .
    
    - name: Type check (non bloquant temporaire)
      run: npx tsc --noEmit || echo "Type errors (non bloquant)"
      working-directory: .
      continue-on-error: true
    
    - name: Run linting
      run: npm run lint
      working-directory: .
      continue-on-error: true
    
    - name: Build (non bloquant temporaire)
      run: npm run build || echo "Build errors (non bloquant)"
      working-directory: .
      continue-on-error: true
